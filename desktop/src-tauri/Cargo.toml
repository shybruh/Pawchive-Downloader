[package]
name = "pawchive"
version = "2.0.0"
description = "Pawchive Downloader desktop shell"
authors = ["Pawchive contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pawchive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "macros", "rt"] }
tiny_http = "0.12"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13", features = ["blocking", "form", "json"] }
crc32fast = "1"
regex = "1"
indexmap = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
md-5 = "0.10"
html-escape = "0.2"
chrono = "0.4"
scraper = "0.24"
urlencoding = "2"


[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Shell"] }
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
